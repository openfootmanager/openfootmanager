[package]
name = "mcp-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mcp-results = { path = "../mcp-results" }
db = { path = "../db" }
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }

[lints]
workspace = true
