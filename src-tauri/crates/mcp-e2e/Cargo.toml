[package]
name = "mcp-e2e"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mcp-results = { path = "../mcp-results" }
serde = "1"
serde_json = "1"
x11rb = { version = "0.13", default-features = false }
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
db = { path = "../db" }
# The save-fidelity check writes the loaded save in the truthful form (`ofm_core::wire`), the form
# `dev_full_game_state` reports, so a lost potential column still fails it.
ofm_core = { path = "../ofm_core" }
chrono = { version = "0.4", default-features = false }

[lints]
workspace = true
