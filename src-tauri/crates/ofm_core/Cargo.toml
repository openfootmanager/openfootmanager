[package]
name = "ofm_core"
version = "0.3.0"
edition = "2024"
publish = false

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
log = "0.4"
domain = { version = "0.3.0", path = "../domain" }
engine = { version = "0.3.0", path = "../engine" }
rand = "0.10"
# Named, not `rand::rngs::StdRng`: rand reserves the right to change what StdRng is, and a saved
# career must replay the same way after a dependency bump. See `Game::rng_for`.
rand_chacha = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Pinned for the reason given in `crates/domain/Cargo.toml`.
ts-rs = { version = "=12.0.1", features = ["chrono-impl", "serde-json-impl"] }
uuid = { version = "1.21.0", features = ["v4"] }
# Deflate only. The installer decodes whatever method an untrusted .ofm declares, and every
# writer here emits Deflated, so each extra codec would be attack surface with no file that needs
# it (zstd's default-on stack carried four RUSTSEC advisories). Without `time`, entries carry
# zip's fixed 1980 timestamp, which nothing reads.
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[lints]
workspace = true

[dev-dependencies]
proptest = "=1.12.0"
