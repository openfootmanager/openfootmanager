# The exemption must not become a way to smuggle an unpinned Rust build past the rule. Three
# spellings are here on purpose: a second step that builds, and a build chained onto the
# exempt line itself — once for each exempt tool, since the two are separate branches of one
# alternation and a fixture covering only cargo-deny would not notice the other going wrong.
name: sneaky
on: [workflow_dispatch]
jobs:
  sneaky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses && cargo build --release
      - run: cargo machete --skip-target-dir src-tauri && cargo check --workspace
      - run: cargo test --manifest-path src-tauri/Cargo.toml --workspace
