name: build-check

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:
  # Called by the two release workflows before they publish anything. `uses:` with a
  # local path runs the caller's own copy of this file, so the checks a release must
  # pass cannot drift from the checks a PR must pass — there is only one definition.
  workflow_call:

# Every job here only reads the repo — checkout, build, test, lint. Nothing
# publishes a release or comments on the PR, so the token needs nothing more.
# The release workflows set `contents: write` on the jobs that actually need it.
permissions:
  contents: read

jobs:
  # Its own job rather than a step inside `backend`: this needs no toolchain, no apt and no npm,
  # so it goes red in seconds with an unambiguous check name instead of being buried in a job
  # whose failures are usually about something else entirely.
  toolchain-pin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The fixtures run first. They are the only thing that proves the check still rejects what
      # it claims to reject: the real repository is correct, so a loosened regex would sail
      # through the step below and report success.
      - name: Check the toolchain check still rejects violations
        run: ./scripts/check-toolchain-pin.test.sh

      - name: Check Rust toolchain pins agree
        run: ./scripts/check-toolchain-pin.sh

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  tauri-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Run Tauri smoke build
        run: npx tauri build --debug --no-bundle --ci

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      # Keep this version equal to `rust-toolchain.toml`'s channel; scripts/check-toolchain-pin.sh
      # fails the build if they drift. `rustfmt` is installed alongside clippy so the components
      # match what the toolchain file declares, and so the pending repo-wide format sweep has a
      # formatter from the same compiler CI uses.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Every cargo invocation below passes `--locked`. Committing `Cargo.lock` only buys a
      # reproducible build if something refuses to silently resolve around it — without this,
      # cargo would quietly update the lockfile in the runner's checkout and CI could be testing
      # a dependency set that exists nowhere else. With it, a manifest change that was not
      # accompanied by its lockfile fails here and says so.
      - name: Run backend tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace

      # `mod mcp_server` is behind a Cargo feature, so the step above never
      # compiles it — nine tests under src/mcp_server/ (167 vs 176 in the lib
      # target) have never run on CI. Same blind spot the clippy pair below
      # closes, and the same class of trap as `cargo test --bin` matching zero
      # tests.
      #
      # `--lib`, not `--workspace`: the mcp tests live only in the root
      # openfootmanager_lib target. Building the whole workspace's test binaries
      # under a second feature set shares no cached artifacts with the step
      # above and took 80 minutes of CI time for these nine tests; scoped to
      # `--lib` it measures ~5 minutes.
      - name: Run backend tests (mcp feature)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --features mcp

      - name: Check backend compilation
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --workspace

      # Clippy is a hard gate: any warning fails the build. Run the same command
      # locally before pushing (or use the /preflight skill).
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      # The MCP server sits behind a Cargo feature, so the step above never
      # compiles it. Without this, ~90 tools' worth of code is unlinted.
      - name: Clippy (mcp feature)
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --features mcp -- -D warnings

# ── Gates deliberately NOT enabled yet ───────────────────────────────────────
#
# `cargo fmt --check`  — reports ~630 diffs across 82 files today. The repo has
#     never had a formatting gate, so enabling one requires a standalone
#     `cargo fmt --all` sweep first; doing it here would bury every real change
#     and conflict with every open branch.
#
# `biome lint`  — a first run reports ~480 findings plus a large formatter diff.
#     Same reasoning: the sweep is its own piece of work.
#
# `npm run audit:i18n`  — a heuristic reporter that always exits 0, so it cannot
#     gate anything. Locale coverage is already enforced by
#     src/i18n/localeCoverage.test.ts and frontendKeyCoverage.test.ts, which run
#     as part of `npm test` in the frontend job above.
#
# `tsc --noEmit`  — redundant: `npm run build` is `tsc && vite build`, so type
#     errors already fail the frontend job.
#
# `--features save-snapshots`  — a third feature-gated path (forwards to
#     `db/save-snapshots`) that is still neither linted nor tested here. It is a
#     dev-only debugging aid rather than shipped behaviour, so it is lower value
#     than the `mcp` pair above — but it is a real gap, not an oversight.
