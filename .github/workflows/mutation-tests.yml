name: mutation-tests

# The instrument for test *quality*, which no other gate here measures.
#
# Everything else in this repository asks "does the code pass its tests". This asks the harder
# question: if the code were wrong, would the tests notice? cargo-mutants changes one thing at a
# time — flips a comparison, returns a default — and reports the changes that no test objected to.
# A surviving mutant is a line nothing actually checks.
#
# That is the #416 failure mode written down: a unit test asserted only the values where two
# implementations already agreed, so it passed while the bug shipped.
#
# ⚠ Never a pull-request gate. A full run across this workspace is hours, and survivors need a
# person to judge — plenty are equivalent mutants that no test could reasonably catch. Blocking a
# PR on that would be the fastest way to get this deleted.
#
# The work is cut into *slots*, each one bucket of one crate, sized to finish inside one job.
# GitHub stops a hosted job at six hours, and the crates are nothing alike (21 Oct 2026):
#
#   domain      420 mutants     1 bucket
#   db          553 mutants     2 buckets   17.8 s each, measured (27 Sep 2026: 2h 27m)
#   engine    1,648 mutants     4 buckets   ~4.5 s each on a workstation; not yet measured here
#   ofm_core  9,524 mutants    44 buckets   34.2 s each, measured (6 Oct 2026); 115 s before
#                                           the build changes in the mutate step below
#
# A mutant's bucket comes from a hash of its name without the line and column, so it stays put
# while the code around it changes, and the bucket counts are constants. `scripts/mutation-slot.sh`
# holds them, the per-mutant costs, and where each number came from; it refuses a bucket that has
# outgrown its slot instead of planning one that cannot finish. Eight slots run in parallel each
# Sunday, so the 51-slot rotation tests every mutant once in a little under seven weeks.
#
# This replaced a rotation of `--shard` slots whose count was recomputed from the live mutant
# counts every run. The count moved (29 to 32 `ofm_core` shards between 11 and 18 Oct 2026) and
# the rotation jumped with it; and because cargo-mutants deals shards by position in its list,
# one added mutant reshuffled every shard after it, so consecutive weeks never added up to a
# full pass.

on:
  schedule:
    # 04:41 UTC on Sundays. Off the hour deliberately — GitHub queues scheduled runs and the top
    # of the hour is when everyone else's cron fires, so `0 4` can sit in the backlog a long time.
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to mutate
        required: false
        default: domain
        type: choice
        options:
          - domain
          - db
          - engine
          - ofm_core
      bucket:
        description: "Zero-based bucket, e.g. 3/44. Leave blank for the first bucket of the chosen crate."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Generous, because the point is to finish rather than to be quick — but bounded, so a hung
    # run cannot burn six hours of the default timeout unnoticed.
    timeout-minutes: 300

    # Eight slots each Sunday, one per job; a manual dispatch runs exactly the one it names. The
    # jobs find their slot from `strategy.job-index` and `strategy.job-total`, so this list is the
    # only place the weekly number is written down. `fail-fast: false` because each job is hours
    # of independent work: one slot overrunning must not cancel the other seven. Nothing reads
    # `matrix.job` itself; its values exist only to set how many jobs there are.
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(github.event_name == 'schedule' && '[0, 1, 2, 3, 4, 5, 6, 7]' || '[0]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Pinned for the same reason every other tool here is: the mutation operators change between
      # releases, so an unpinned tool turns someone else's release into a different report.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@25.3.1

      # A cron trigger carries no inputs, so the week number and this job's place in the matrix
      # pick the slot; a manual dispatch names its own crate and, optionally, its bucket. Weeks
      # are counted from the Unix epoch, so the rotation continues across year boundaries.
      #
      # The slot is then turned into the exact mutants it holds: `--list` (it only parses the
      # source, so this costs seconds) feeds `mutation-slot.sh select`, which prints one anchored
      # `--re` pattern per mutant of the bucket. A listing that fails stops the step under `-e`;
      # one that prints nothing, or a bucket that selects nothing, is refused by the script,
      # because a run with no `--re` at all would mutate the whole crate.
      #
      # Last, cargo-mutants itself is asked how many mutants those patterns select. If that is
      # not the bucket's size, an escaping slip would quietly test fewer mutants than planned, so
      # the job stops here rather than after hours of work on the wrong set.
      - name: Choose this week's slot
        id: crate
        env:
          INPUT_CRATE: ${{ inputs.crate }}
          INPUT_BUCKET: ${{ inputs.bucket }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          # `slot=` on its own line: a failure inside `read <<< "$(…)"` is not one `-e` sees, so
          # the planner refusing its input would otherwise surface later as "Invalid crate: ".
          if [ -n "$INPUT_CRATE" ] && [ -n "$INPUT_BUCKET" ]; then
            slot="$INPUT_CRATE $INPUT_BUCKET"
          elif [ -n "$INPUT_CRATE" ]; then
            slot="$(./scripts/mutation-slot.sh first "$INPUT_CRATE")"
          else
            week=$(( $(date -u +%s) / 604800 ))
            slot="$(./scripts/mutation-slot.sh pick "$week" "$JOB_INDEX" "$JOB_TOTAL")"
          fi
          read -r crate bucket <<< "$slot"
          case "$crate" in
            domain|db|engine|ofm_core) ;;
            *) echo "Invalid crate: $crate" >&2; exit 1 ;;
          esac

          listing="$RUNNER_TEMP/mutants-listing.txt"
          examine="$RUNNER_TEMP/mutants-examine.txt"
          # `--colors never`: rust-toolchain exports CARGO_TERM_COLOR=always for every step, and
          # a coloured listing put escape codes into each `--re` pattern (25 Oct 2026).
          cargo mutants --manifest-path src-tauri/Cargo.toml --package "$crate" --list \
            --colors never > "$listing"
          # `select` validates the bucket, including one typed into a manual dispatch.
          ./scripts/mutation-slot.sh select "$crate" "$bucket" < "$listing" > "$examine"
          planned="$(wc -l < "$examine")"
          re_args=()
          while IFS= read -r pattern; do re_args+=(--re "$pattern"); done < "$examine"
          matched="$(cargo mutants --manifest-path src-tauri/Cargo.toml --package "$crate" \
            --list --colors never "${re_args[@]}" | wc -l)"
          if [ "$matched" -ne "$planned" ]; then
            echo "Bucket $bucket of $crate has $planned mutants, but its patterns match $matched" >&2
            exit 1
          fi

          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "examine=$examine" >> "$GITHUB_OUTPUT"
          # A filesystem-safe label for the artifact name: `ofm_core 3/44` -> `ofm_core-b3of44`.
          echo "label=${crate}-b${bucket/\//of}" >> "$GITHUB_OUTPUT"
          echo "Mutating $crate, bucket $bucket: $planned mutants"

      # Surviving mutants are the *output*, not a failure. Which exit statuses mean "the run did
      # its job" is decided by `scripts/mutation-outcome.sh`, which says why for each one and is
      # tested in build-check — that check has been wrong three times, most recently over exit 3
      # (a timed-out mutant), which failed a 140-mutant run on 6 Oct 2026 after it had finished.
      #
      # Two traps here, both sprung on this job's first scheduled run (27 Sep 2026), which tested
      # 495 mutants of `db` over 2h 27m and then threw the results away:
      #
      #   * Actions runs every `run:` block under `bash -e`. A `set -uo pipefail` does not turn
      #     `-e` off, so the moment cargo-mutants exited 2 the step died — the line meant to accept
      #     exit 2 was never reached. `|| status=$?` is what exempts the call from `-e`.
      #   * `--output DIR` creates `mutants.out` *inside* DIR ("Create mutants.out within this
      #     directory", per the CLI's own help), so the report is `DIR/mutants.out/outcomes.json`.
      #     The first version checked `DIR/outcomes.json` and would have failed every week even
      #     with the exit status fixed.
      #
      # The step timeout sits under the job's on purpose. A slot that overruns fails *this step*,
      # and the upload below still runs; if it were the job that timed out instead, GitHub would
      # cancel the whole job and the upload would never happen.
      #
      # Every mutant rebuilds the crate under test, and for `ofm_core` that rebuild was 90 of the
      # 115 seconds a mutant cost on 4 Oct 2026. Two settings bring it down. On a hosted runner
      # (6 Oct 2026, 140 mutants) an `ofm_core` mutant then cost 34 s: 16 s to build, 18 s to test.
      #
      #   * `CARGO_INCREMENTAL=1`. rust-cache exports `CARGO_INCREMENTAL=0` for the whole job,
      #     which is right for a one-shot CI build and wrong for this one: cargo-mutants rebuilds
      #     the same crate hundreds of times with a one-line difference, which is the case
      #     incremental compilation exists for. Exported inside the script, not in `env:`, so it
      #     is certain to win over the value rust-cache wrote to `$GITHUB_ENV`.
      #   * `--profile mutants` (`src-tauri/Cargo.toml`): the test profile without debuginfo.
      #     Nobody reads a mutant's backtrace, and generating debuginfo is part of every rebuild.
      - name: Mutate ${{ steps.crate.outputs.name }} (bucket ${{ steps.crate.outputs.bucket }})
        timeout-minutes: 270
        env:
          MUTATION_CRATE: ${{ steps.crate.outputs.name }}
          MUTATION_EXAMINE: ${{ steps.crate.outputs.examine }}
        run: |
          set -uo pipefail
          export CARGO_INCREMENTAL=1
          re_args=()
          while IFS= read -r pattern; do re_args+=(--re "$pattern"); done < "$MUTATION_EXAMINE"
          # The previous step refused an empty bucket; this guards the hand-off, because no
          # `--re` at all means the whole crate.
          if [ "${#re_args[@]}" -eq 0 ]; then
            echo "No mutants selected for $MUTATION_CRATE" >&2
            exit 1
          fi
          status=0
          cargo mutants --manifest-path src-tauri/Cargo.toml \
            --package "$MUTATION_CRATE" \
            "${re_args[@]}" \
            --profile mutants \
            --in-place --no-shuffle --timeout 300 \
            --output mutants-out || status=$?

          ./scripts/mutation-outcome.sh "$status" mutants-out/mutants.out/outcomes.json

      # A slot that passes is green with its findings inside the artifact, and nobody downloads
      # an artifact from a green run. The survivors and timeouts go on the run's summary page
      # instead, where they are read. `!cancelled()` for the same reason as the upload below.
      - name: Summarise the survivors
        if: ${{ !cancelled() }}
        env:
          MUTATION_CRATE: ${{ steps.crate.outputs.name }}
          MUTATION_BUCKET: ${{ steps.crate.outputs.bucket }}
        run: |
          set -uo pipefail
          report=mutants-out/mutants.out
          lines_in() {
            if [ -f "$report/$1.txt" ]; then wc -l < "$report/$1.txt"; else echo 0; fi
          }
          {
            echo "## Mutants: $MUTATION_CRATE, bucket $MUTATION_BUCKET"
            echo ""
            if [ ! -d "$report" ]; then
              echo "No report: the run stopped before cargo-mutants wrote one."
            else
              echo "| caught | missed | timeout | unviable |"
              echo "|---|---|---|---|"
              echo "| $(lines_in caught) | $(lines_in missed) | $(lines_in timeout) | $(lines_in unviable) |"
              for kind in missed timeout; do
                if [ "$(lines_in "$kind")" -gt 0 ]; then
                  echo ""
                  echo "### $kind"
                  echo '```text'
                  cat "$report/$kind.txt"
                  echo '```'
                fi
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `!cancelled()` rather than the default `success()`: a run that fails partway still leaves
      # whatever it measured on disk, and two hours of mutants are worth keeping even then. The
      # first scheduled run lost its entire report to exactly that default.
      - name: Upload the survivor list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ steps.crate.outputs.label }}
          path: mutants-out/
          retention-days: 30
