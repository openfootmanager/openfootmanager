name: mutation-tests

# The instrument for test *quality*, which no other gate here measures.
#
# Everything else in this repository asks "does the code pass its tests". This asks the harder
# question: if the code were wrong, would the tests notice? cargo-mutants changes one thing at a
# time — flips a comparison, returns a default — and reports the changes that no test objected to.
# A surviving mutant is a line nothing actually checks.
#
# That is the #416 failure mode written down: a unit test asserted only the values where two
# implementations already agreed, so it passed while the bug shipped.
#
# ⚠ Never a pull-request gate. A full run across this workspace is hours, and survivors need a
# person to judge — plenty are equivalent mutants that no test could reasonably catch. Blocking a
# PR on that would be the fastest way to get this deleted.
#
# One *slot* a week, not one crate. Measured on the first scheduled run, each mutant costs about
# 18 seconds here (~14.7s to build, ~4.8s to test), and the crates are very different sizes:
#
#   domain      312 mutants    ~1.5 h
#   db          499 mutants    ~2.5 h   (actual first run: 2h 27m)
#   engine    1,508 mutants    ~7.5 h
#   ofm_core  7,438 mutants     ~37 h
#
# GitHub stops any hosted job at six hours, so whole-crate weeks for `engine` and `ofm_core`
# could never finish. The rotation below splits them with `--shard` into slots of roughly 500-570
# mutants (about three hours each): 18 slots, so every mutant is exercised once every 18 weeks.

on:
  schedule:
    # 04:41 UTC on Sundays. Off the hour deliberately — GitHub queues scheduled runs and the top
    # of the hour is when everyone else's cron fires, so `0 4` can sit in the backlog a long time.
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to mutate
        required: false
        default: domain
        type: choice
        options:
          - domain
          - db
          - engine
          - ofm_core
      shard:
        description: "Zero-based shard, e.g. 0/3. Leave blank for the first shard of the chosen crate."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Generous, because the point is to finish rather than to be quick — but bounded, so a hung
    # run cannot burn six hours of the default timeout unnoticed.
    timeout-minutes: 300

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Pinned for the same reason every other tool here is: the mutation operators change between
      # releases, so an unpinned tool turns someone else's release into a different report.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@25.3.1

      # A cron trigger carries no inputs, so the week number picks the slot; a manual dispatch
      # names its own crate and shard. Shards are zero-based: `ofm_core 12/13` is the last one.
      # Count weeks from the Unix epoch so the rotation continues across year boundaries.
      - name: Choose this week's slot
        id: crate
        env:
          INPUT_CRATE: ${{ inputs.crate }}
          INPUT_SHARD: ${{ inputs.shard }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_CRATE" ]; then
            crate="$INPUT_CRATE"
            shard="$INPUT_SHARD"
            if [ -z "$shard" ]; then
              case "$crate" in
                engine) shard="0/3" ;;
                ofm_core) shard="0/13" ;;
                *) shard="0/1" ;;
              esac
            fi
          else
            slots=("domain 0/1" "db 0/1")
            for i in 0 1 2; do slots+=("engine $i/3"); done
            for ((i=0;i<13;i++)); do slots+=("ofm_core $i/13"); done
            week=$(( $(date -u +%s) / 604800 ))
            read -r crate shard <<< "${slots[$((week % ${#slots[@]}))]}"
          fi
          case "$crate" in
            domain|db|engine|ofm_core) ;;
            *) echo "Invalid crate: $crate" >&2; exit 1 ;;
          esac
          if [[ ! "$shard" =~ ^[0-9]+/[0-9]+$ ]]; then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          IFS=/ read -r shard_index shard_count <<< "$shard"
          if (( ${#shard_index} > 18 || ${#shard_count} > 18 )); then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          if (( 10#$shard_count == 0 || 10#$shard_index >= 10#$shard_count )); then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          # A filesystem-safe label for the artifact name: `ofm_core 3/13` -> `ofm_core-3of13`.
          echo "label=${crate}-${shard/\//of}" >> "$GITHUB_OUTPUT"
          echo "Mutating $crate, shard $shard"

      # Surviving mutants are the *output*, not a failure — a red tick on a weekly job nobody can
      # act on today is how a scheduled job becomes invisible. cargo-mutants exits 2 for exactly
      # that case, so that one status is swallowed and nothing else is: a bare `|| true` would
      # have turned a missing tool or a compilation failure into a green job with no report,
      # which is the same silent-pass shape this whole programme exists to stop.
      #
      # Two traps, both sprung on this job's first scheduled run (27 Sep 2026), which tested 495
      # mutants of `db` over 2h 27m and then threw the results away:
      #
      #   * Actions runs every `run:` block under `bash -e`. A `set -uo pipefail` does not turn
      #     `-e` off, so the moment cargo-mutants exited 2 the step died — the line meant to accept
      #     exit 2 was never reached. `|| status=$?` is what exempts the call from `-e`.
      #   * `--output DIR` creates `mutants.out` *inside* DIR ("Create mutants.out within this
      #     directory", per the CLI's own help), so the report is `DIR/mutants.out/outcomes.json`.
      #     The first version checked `DIR/outcomes.json` and would have failed every week even
      #     with the exit status fixed.
      #
      # The step timeout sits under the job's on purpose. A slot that overruns fails *this step*,
      # and the upload below still runs; if it were the job that timed out instead, GitHub would
      # cancel the whole job and the upload would never happen.
      - name: Mutate ${{ steps.crate.outputs.name }} (shard ${{ steps.crate.outputs.shard }})
        timeout-minutes: 270
        env:
          MUTATION_CRATE: ${{ steps.crate.outputs.name }}
          MUTATION_SHARD: ${{ steps.crate.outputs.shard }}
        run: |
          set -uo pipefail
          status=0
          cargo mutants --manifest-path src-tauri/Cargo.toml \
            --package "$MUTATION_CRATE" \
            --shard "$MUTATION_SHARD" \
            --in-place --no-shuffle --timeout 300 \
            --output mutants-out || status=$?

          # 0 = nothing survived, 2 = some mutants survived. Anything else is a real failure.
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "cargo-mutants failed with status $status — this is a tool or build failure," >&2
            echo "not a surviving mutant." >&2
            exit "$status"
          fi

          # And a run that produced no report produced nothing, whatever it exited with.
          if [ ! -s mutants-out/mutants.out/outcomes.json ]; then
            echo "cargo-mutants exited $status but wrote no mutants-out/mutants.out/outcomes.json." >&2
            exit 1
          fi

      # `!cancelled()` rather than the default `success()`: a run that fails partway still leaves
      # whatever it measured on disk, and two hours of mutants are worth keeping even then. The
      # first scheduled run lost its entire report to exactly that default.
      - name: Upload the survivor list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ steps.crate.outputs.label }}
          path: mutants-out/
          retention-days: 30
