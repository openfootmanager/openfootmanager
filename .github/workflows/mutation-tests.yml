name: mutation-tests

# The instrument for test *quality*, which no other gate here measures.
#
# Everything else in this repository asks "does the code pass its tests". This asks the harder
# question: if the code were wrong, would the tests notice? cargo-mutants changes one thing at a
# time — flips a comparison, returns a default — and reports the changes that no test objected to.
# A surviving mutant is a line nothing actually checks.
#
# That is the #416 failure mode written down: a unit test asserted only the values where two
# implementations already agreed, so it passed while the bug shipped.
#
# ⚠ Never a pull-request gate. A full run across this workspace is hours, and survivors need a
# person to judge — plenty are equivalent mutants that no test could reasonably catch. Blocking a
# PR on that would be the fastest way to get this deleted.
#
# The work is cut into *slots*, each a crate or one `--shard` of a crate, sized to finish inside
# one job. GitHub stops a hosted job at six hours, and the crates are nothing alike:
#
#   domain      367 mutants
#   db          488 mutants    17.8 s each, measured (27 Sep 2026: 2h 27m)
#   engine    1,547 mutants    ~4.5 s each on a workstation; not yet measured here
#   ofm_core  8,360 mutants    34.2 s each, measured (6 Oct 2026); 115 s before the build changes
#                              in the mutate step below
#
# This used to be one fixed slot a week, with `ofm_core` split 13 ways on the strength of the
# `db` figure. `ofm_core`'s mutants turned out to cost six times as much, so its slots needed
# about twenty hours each: the 4 Oct run timed out after 141 of 643 mutants. The split is now
# computed every run from the live mutant counts and a per-crate cost, by
# `scripts/mutation-slot.sh` — the costs live there, with where each one came from, and that is
# the file to change when a run overruns. Six slots run in parallel each Sunday, so the rotation
# (32 slots at the counts above) comes round about every six weeks.

on:
  schedule:
    # 04:41 UTC on Sundays. Off the hour deliberately — GitHub queues scheduled runs and the top
    # of the hour is when everyone else's cron fires, so `0 4` can sit in the backlog a long time.
    - cron: "41 4 * * 0"
  workflow_dispatch:
    inputs:
      crate:
        description: Which crate to mutate
        required: false
        default: domain
        type: choice
        options:
          - domain
          - db
          - engine
          - ofm_core
      shard:
        description: "Zero-based shard, e.g. 0/3. Leave blank for the first shard of the chosen crate."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  mutants:
    runs-on: ubuntu-latest
    # Generous, because the point is to finish rather than to be quick — but bounded, so a hung
    # run cannot burn six hours of the default timeout unnoticed.
    timeout-minutes: 300

    # Six slots each Sunday, one per job; a manual dispatch runs exactly the one it names. The
    # jobs find their slot from `strategy.job-index` and `strategy.job-total`, so this list is the
    # only place the weekly number is written down. `fail-fast: false` because each job is hours
    # of independent work: one slot overrunning must not cancel the other five. Nothing reads
    # `matrix.job` itself; its values exist only to set how many jobs there are.
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(github.event_name == 'schedule' && '[0, 1, 2, 3, 4, 5]' || '[0]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      # Pinned for the same reason every other tool here is: the mutation operators change between
      # releases, so an unpinned tool turns someone else's release into a different report.
      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@25.3.1

      # A cron trigger carries no inputs, so the week number and this job's place in the matrix
      # pick the slot; a manual dispatch names its own crate and shard. Count weeks from the Unix
      # epoch so the rotation continues across year boundaries.
      #
      # The shard counts come from today's mutant counts, not from a table written down once —
      # see `scripts/mutation-slot.sh` for why. `--list` only parses the source, so this costs
      # seconds. A listing that fails stops the step here under `-e`; one that prints nothing
      # counts as zero, which the script refuses rather than quietly planning without that crate.
      # The rotation shifts when a count crosses a shard boundary. That is no real loss of
      # coverage: cargo-mutants deals mutants to shards by their position in the list, so any
      # commit that adds or removes one mutant already reshuffles every shard of that crate, and a
      # fixed table never promised each mutant a turn either. The rotation guarantees each slot
      # *of the code as it stands that week* is a fair sample — and that it finishes.
      - name: Choose this week's slot
        id: crate
        env:
          INPUT_CRATE: ${{ inputs.crate }}
          INPUT_SHARD: ${{ inputs.shard }}
          JOB_INDEX: ${{ strategy.job-index }}
          JOB_TOTAL: ${{ strategy.job-total }}
        run: |
          set -euo pipefail
          count_mutants() {
            counts=()
            for listed in domain db engine ofm_core; do
              count="$(cargo mutants --manifest-path src-tauri/Cargo.toml --package "$listed" --list | wc -l)"
              counts+=("$listed=$count")
            done
            echo "Mutant counts: ${counts[*]}"
          }

          # `slot=` on its own line: a failure inside `read <<< "$(…)"` is not one `-e` sees, so
          # the planner refusing its input would otherwise surface later as "Invalid crate: ".
          # A manual run that names its shard needs no counts, so it does not list anything.
          if [ -n "$INPUT_CRATE" ] && [ -n "$INPUT_SHARD" ]; then
            slot="$INPUT_CRATE $INPUT_SHARD"
          elif [ -n "$INPUT_CRATE" ]; then
            count_mutants
            slot="$(./scripts/mutation-slot.sh first "$INPUT_CRATE" "${counts[@]}")"
          else
            count_mutants
            week=$(( $(date -u +%s) / 604800 ))
            slot="$(./scripts/mutation-slot.sh pick "$week" "$JOB_INDEX" "$JOB_TOTAL" "${counts[@]}")"
          fi
          read -r crate shard <<< "$slot"
          case "$crate" in
            domain|db|engine|ofm_core) ;;
            *) echo "Invalid crate: $crate" >&2; exit 1 ;;
          esac
          if [[ ! "$shard" =~ ^[0-9]+/[0-9]+$ ]]; then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          IFS=/ read -r shard_index shard_count <<< "$shard"
          if (( ${#shard_index} > 18 || ${#shard_count} > 18 )); then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          if (( 10#$shard_count == 0 || 10#$shard_index >= 10#$shard_count )); then
            echo "Invalid shard: $shard" >&2
            exit 1
          fi
          echo "name=$crate" >> "$GITHUB_OUTPUT"
          echo "shard=$shard" >> "$GITHUB_OUTPUT"
          # A filesystem-safe label for the artifact name: `ofm_core 3/13` -> `ofm_core-3of13`.
          echo "label=${crate}-${shard/\//of}" >> "$GITHUB_OUTPUT"
          echo "Mutating $crate, shard $shard"

      # Surviving mutants are the *output*, not a failure. Which exit statuses mean "the run did
      # its job" is decided by `scripts/mutation-outcome.sh`, which says why for each one and is
      # tested in build-check — that check has been wrong three times, most recently over exit 3
      # (a timed-out mutant), which failed a 140-mutant run on 6 Oct 2026 after it had finished.
      #
      # Two traps here, both sprung on this job's first scheduled run (27 Sep 2026), which tested
      # 495 mutants of `db` over 2h 27m and then threw the results away:
      #
      #   * Actions runs every `run:` block under `bash -e`. A `set -uo pipefail` does not turn
      #     `-e` off, so the moment cargo-mutants exited 2 the step died — the line meant to accept
      #     exit 2 was never reached. `|| status=$?` is what exempts the call from `-e`.
      #   * `--output DIR` creates `mutants.out` *inside* DIR ("Create mutants.out within this
      #     directory", per the CLI's own help), so the report is `DIR/mutants.out/outcomes.json`.
      #     The first version checked `DIR/outcomes.json` and would have failed every week even
      #     with the exit status fixed.
      #
      # The step timeout sits under the job's on purpose. A slot that overruns fails *this step*,
      # and the upload below still runs; if it were the job that timed out instead, GitHub would
      # cancel the whole job and the upload would never happen.
      #
      # Every mutant rebuilds the crate under test, and for `ofm_core` that rebuild was 90 of the
      # 115 seconds a mutant cost on 4 Oct 2026. Two settings bring it down. On a hosted runner
      # (6 Oct 2026, 140 mutants) an `ofm_core` mutant then cost 34 s: 16 s to build, 18 s to test.
      #
      #   * `CARGO_INCREMENTAL=1`. rust-cache exports `CARGO_INCREMENTAL=0` for the whole job,
      #     which is right for a one-shot CI build and wrong for this one: cargo-mutants rebuilds
      #     the same crate hundreds of times with a one-line difference, which is the case
      #     incremental compilation exists for. Exported inside the script, not in `env:`, so it
      #     is certain to win over the value rust-cache wrote to `$GITHUB_ENV`.
      #   * `--profile mutants` (`src-tauri/Cargo.toml`): the test profile without debuginfo.
      #     Nobody reads a mutant's backtrace, and generating debuginfo is part of every rebuild.
      - name: Mutate ${{ steps.crate.outputs.name }} (shard ${{ steps.crate.outputs.shard }})
        timeout-minutes: 270
        env:
          MUTATION_CRATE: ${{ steps.crate.outputs.name }}
          MUTATION_SHARD: ${{ steps.crate.outputs.shard }}
        run: |
          set -uo pipefail
          export CARGO_INCREMENTAL=1
          status=0
          cargo mutants --manifest-path src-tauri/Cargo.toml \
            --package "$MUTATION_CRATE" \
            --shard "$MUTATION_SHARD" \
            --profile mutants \
            --in-place --no-shuffle --timeout 300 \
            --output mutants-out || status=$?

          ./scripts/mutation-outcome.sh "$status" mutants-out/mutants.out/outcomes.json

      # `!cancelled()` rather than the default `success()`: a run that fails partway still leaves
      # whatever it measured on disk, and two hours of mutants are worth keeping even then. The
      # first scheduled run lost its entire report to exactly that default.
      - name: Upload the survivor list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mutants-${{ steps.crate.outputs.label }}
          path: mutants-out/
          retention-days: 30
