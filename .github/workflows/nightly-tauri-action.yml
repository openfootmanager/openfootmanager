name: publish-nightly

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional nightly tag override
        required: false
        type: string
  push:
    branches:
      - develop

# Each build now publishes its own tag, so two runs can no longer fight over one release.
# The group stays to avoid burning five platforms' worth of runners on a commit that a newer
# push has already superseded.
concurrency:
  group: nightly-release
  cancel-in-progress: true

jobs:
  prepare-nightly:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release_settings.outputs.tag }}
      display_version: ${{ steps.release_settings.outputs.display_version }}
      release_name: ${{ steps.release_settings.outputs.release_name }}
      release_body: ${{ steps.release_settings.outputs.release_body }}
    steps:
      # Read-only job: reads tauri.conf.json and calls gh api via GH_TOKEN, never
      # touches git, so the checkout credentials are not needed.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve nightly release metadata
        id: release_settings
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          nightly_date="$(date -u +%F)"
          compact_date="$(date -u +%Y%m%d)"
          short_sha="${GITHUB_SHA::7}"

          # One release per build, not one release forever. The previous fixed `nightly` tag
          # meant every run edited the *same* release: its `published_at` never advanced, so the
          # releases page showed one entry dated whenever it was first created, and the history
          # of what shipped each night did not exist anywhere. The commit sha is in the tag
          # because `develop` can take more than one push in a day.
          tag="${INPUT_RELEASE_TAG:-nightly-${compact_date}-${short_sha}}"
          base_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          display_version="${base_version}-nightly.${compact_date}+${short_sha}"

          release_name="Openfoot Manager Nightly ${display_version}"

          compare_line=""
          last_stable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -n "$last_stable" ]; then
            compare_line="Changes since \`${last_stable}\`: https://github.com/${GITHUB_REPOSITORY}/compare/${last_stable}...${GITHUB_SHA}"
          fi

          {
            echo "tag=$tag"
            echo "display_version=$display_version"
            echo "release_name=$release_name"
            echo "release_body<<EOF"
            echo "Rolling nightly build from \`develop\` — **unstable**, expect breakage."
            echo ""
            echo "- Version: \`${display_version}\`"
            echo "- Commit: \`${short_sha}\`"
            echo "- Built: ${nightly_date} (UTC)"
            if [ -n "$compare_line" ]; then
              echo ""
              echo "$compare_line"
            fi
            echo ""
            echo "Each nightly gets its own tag and release; this one is the build of \`${short_sha}\`."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # The same gauntlet a pull request has to pass, run against the commit that is about
  # to be published. `build-check.yml` triggers on `pull_request`, so nothing else
  # tests `develop` itself: a direct push never sees it, and a PR's last green run was
  # computed against whatever the base branch held at the time, not what merged.
  #
  # No `environment:` here on purpose. Verification needs nothing the release
  # environment grants, and putting it behind the environment's protection rules would
  # gate the tests on the approval rather than the other way round.
  verify:
    uses: ./.github/workflows/build-check.yml

  publish-tauri-nightly:
    needs: [prepare-nightly, verify]
    environment: ${{ vars.RELEASE_ENVIRONMENT || 'release' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04' || matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bakes the channel into the bundled frontend so the in-app version
          # reads "v0.3.0-nightly · <sha>" instead of looking like a stable build.
          OFM_CHANNEL: nightly
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-nightly.outputs.tag }}
          releaseName: ${{ needs.prepare-nightly.outputs.release_name }}
          releaseBody: ${{ needs.prepare-nightly.outputs.release_body }}
          # Published by `finalize-nightly`, not here. With per-build tags a cancelled run — and
          # `cancel-in-progress` above means a second push cancels the first — used to leave a
          # *published* release carrying whichever platforms had uploaded before the axe fell,
          # with no manifest and no checksums, sitting on the releases page forever looking like
          # a complete build. The rolling tag repaired that on the next run; a per-build tag has
          # no next run. A draft is invisible until something says every platform finished.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # Nothing is ever deleted here: a failed build must not remove a previous good nightly. A
  # build that fails or is cancelled leaves a *draft*, which nobody sees, rather than replacing
  # the last known-good release the way the rolling tag used to.
  #
  # The metadata pipeline is still dispatched explicitly rather than left to `release:
  # published`. That event fires when the *first* platform creates the release, with four
  # platforms' assets still uploading, so a manifest built from it would describe a release that
  # does not exist yet.
  finalize-nightly:
    needs: [prepare-nightly, publish-tauri-nightly]
    # Every platform must have succeeded. `fail-fast: false` lets one fail while the others
    # upload, and the previous condition here (`result != 'skipped'`) was *true* for a failed
    # matrix — so a build missing its macOS bundles would still have been published, with
    # checksums describing a set of assets nobody can download in full. That is the thing the
    # draft was introduced to prevent one commit ago, and the condition did not honour it.
    #
    # A failed or cancelled build now simply stays a draft: invisible, harmless, and still there
    # to look at. Nothing is deleted, so the last good nightly is untouched.
    if: ${{ needs.prepare-nightly.result == 'success' && needs.publish-tauri-nightly.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # contents:write to edit the release below; actions:write to dispatch
      # nightly-release-manifest.yml.
      contents: write
      actions: write
    steps:
      # `persist-credentials: false` because nothing in this job pushes any more. The rolling
      # tag used to be force-moved from here, which needed the credential helper; a per-build tag
      # is created by tauri-action at the commit it built, so there is nothing left to move.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Publish the release and refresh its metadata
        id: finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.tag }}
          RELEASE_NAME: ${{ needs.prepare-nightly.outputs.release_name }}
          RELEASE_BODY: ${{ needs.prepare-nightly.outputs.release_body }}
        run: |
          set -euo pipefail

          # Nothing to finalize if every platform failed and the release was
          # never created.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "No $RELEASE_TAG release exists — every build must have failed."
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"

          # The tag already points at this commit — tauri-action created it there. This step is
          # what makes the release public, which is the point: reaching here means every platform
          # in the matrix has finished, so the assets, the notes and the checksums describe the
          # same build.
          gh release edit "$RELEASE_TAG" \
            --title "$RELEASE_NAME" \
            --notes "$RELEASE_BODY" \
            --draft=false \
            --prerelease

      - name: Dispatch nightly metadata workflow
        if: ${{ steps.finalize.outputs.released == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-nightly.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-nightly.outputs.display_version }}
        run: |
          set -euo pipefail
          gh workflow run nightly-release-manifest.yml \
            -f release_tag="$RELEASE_TAG" \
            -f release_version="$RELEASE_VERSION"
